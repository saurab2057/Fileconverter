# =============================================================
# FILE LOCATION: fileconverter/docker-compose.yml  (ROOT LEVEL)
#
# HOW TO USE:
#   Start everything:  docker compose up --build
#   Stop everything:   docker compose down
#   Stop + wipe data:  docker compose down -v
#   View logs:         docker compose logs -f backend
#   Single service:    docker compose up backend
#
# YOUR .env FILES:
#   backend/.env          ← backend reads from here
#   ai_microservices/.env ← ai service reads from here
# =============================================================

version: "3.9"

services:

  # ── SERVICE 1: React Frontend (NGINX) ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


  # ── SERVICE 2: Node.js Backend (Express) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: backend
    ports:
      - "5000:5000"

    # Reads ALL variables from backend/.env automatically
    env_file:
      - ./backend/.env

    # These OVERRIDE what's in backend/.env
    # Inside Docker, container names are used as hostnames
    # "mongo" resolves to the mongo container, not localhost
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/fileconverter
      AI_SERVICE_URL: http://ai-service:8000

    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads


  # ── SERVICE 3: Python FastAPI AI Microservice ──────────────
  ai-service:
    build:
      context: ./ai_microservices
      dockerfile: Dockerfile
      target: production
    container_name: ai-service
    ports:
      - "8000:8000"

    # Reads ALL variables from ai_microservices/.env automatically
    env_file:
      - ./ai_microservices/.env

    # Override because inside Docker backend is at http://backend:5000
    environment:
      NODE_BACKEND_URL: http://backend:5000

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - model-cache:/root/.cache/huggingface


  # ── SERVICE 4: MongoDB ─────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fileconverter
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped


# ── VOLUMES ───────────────────────────────────────────────────
volumes:
  mongo-data:
  mongo-config:
  uploads:
  model-cache:


# ── NETWORK ───────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge