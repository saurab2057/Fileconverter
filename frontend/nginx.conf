# =============================================================
# FILE LOCATION: fileconverter/frontend/nginx.conf
#
# WHAT THIS FILE DOES:
# Tells NGINX how to serve your React app. Handles 4 things:
# 1. Compress files before sending (gzip) - faster loading
# 2. Add security headers - protects against attacks
# 3. Cache static files - returning users load faster
# 4. Proxy /api/* to your Node.js backend container
# 5. Fix React Router - all URLs serve index.html
# =============================================================

server {
    # Listen on port 80 (standard HTTP)
    listen 80;

    # Accept requests for any hostname
    server_name _;

    # Where your compiled React files are (matches Dockerfile COPY destination)
    root /usr/share/nginx/html;
    index index.html;


    # ── 1. GZIP COMPRESSION ──────────────────────────────────
    # Compress files before sending to browser
    # A 200KB JS file becomes ~50KB = 75% bandwidth saving
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;
    # Only compress files bigger than 1KB (tiny files not worth compressing)
    gzip_min_length 1024;


    # ── 2. SECURITY HEADERS ───────────────────────────────────
    # X-Frame-Options: Prevents your site being loaded in an iframe on another domain
    # Stops "clickjacking" attacks where attackers overlay invisible buttons
    add_header X-Frame-Options "SAMEORIGIN" always;

    # X-Content-Type-Options: Browser must respect Content-Type header
    # Prevents browser "sniffing" a file as JS when server says it's CSS
    add_header X-Content-Type-Options "nosniff" always;

    # X-XSS-Protection: Activates browser's built-in XSS filter
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer-Policy: Controls how much info is sent in Referer header
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # ── 3. CACHE STATIC ASSETS ───────────────────────────────
    # Cache JS, CSS, images for 1 YEAR
    # Safe because Vite adds hash to filenames (main.a8f9d2.js)
    # When code changes → filename changes → browser fetches new file
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # NEVER cache index.html
    # This is the React app entry point - must always be fresh
    # so users get app updates immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }


    # ── 4. PROXY API CALLS TO BACKEND ─────────────────────────
    # When browser calls /api/anything → forward to Node.js backend
    # "backend" is the container name - Docker DNS resolves it automatically
    # This means your React app just calls /api/auth/login
    # and NGINX handles routing it to http://backend:5000/api/auth/login
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        # Required for WebSocket support (if you add real-time features later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Tell backend the real client info (otherwise backend sees NGINX IP)
        # Important for your rate limiting and audit logging in the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_cache_bypass $http_upgrade;
    }


    # ── 5. REACT ROUTER FIX (SPA Fallback) ───────────────────
    # Problem: User visits /dashboard directly in browser
    # NGINX looks for a file called "dashboard" - it doesn't exist → 404
    # Fix: try_files checks for real file first, falls back to index.html
    # React Router then reads the URL and shows the right page
    location / {
        try_files $uri $uri/ /index.html;
    }
}