# =============================================================
# FILE LOCATION: fileconverter/k8s/00-namespace-secrets.yaml
#
# WHAT THIS FILE DOES:
# Creates 2 things in Kubernetes:
#
# 1. NAMESPACE: A "folder" inside your K8s cluster just for this app.
#    All your pods, services, etc. live in "fileconverter-app" namespace.
#    Keeps your app isolated from other apps on the same cluster.
#
# 2. SECRET: Stores all your API keys and passwords securely.
#    Kubernetes encrypts these. Pods read them as environment variables.
#    NEVER put real secret values in this file - encode them first.
#
# HOW TO APPLY:
#   kubectl apply -f k8s/00-namespace-secrets.yaml
#
# HOW TO CREATE SECRETS FROM YOUR .env FILE (easier way):
#   kubectl create secret generic app-secrets \
#     --from-env-file=.env \
#     -n fileconverter-app
#
# HOW TO ENCODE A VALUE MANUALLY:
#   echo -n "your-secret-value" | base64
# =============================================================

# ── PART 1: Namespace ─────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: fileconverter-app
  labels:
    app: fileconverter
    environment: production

---

# ── PART 2: Secrets ───────────────────────────────────────────
# Replace every <base64-encoded-value> with your actual encoded values
# Example: echo -n "mypassword123" | base64  →  bXlwYXNzd29yZDEyMw==
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: fileconverter-app
type: Opaque
data:
  # JWT secrets (from your index.js validateEnvironmentVariables)
  ACCESS_SECRET_KEY: <base64-encoded-value>
  REFRESH_SECRET_KEY: <base64-encoded-value>
  COOKIE_SECRET_KEY: <base64-encoded-value>
  RESET_PASSWORD_SECRET_KEY: <base64-encoded-value>

  # Database
  MONGO_URI: <base64-encoded-value>

  # Internal API key (used between backend and ai_microservices in your config.py)
  INTERNAL_API_KEY: <base64-encoded-value>

  # HuggingFace token (from your config.py - HF_TOKEN)
  HF_TOKEN: <base64-encoded-value>

  # Cloudinary (file uploads)
  CLOUDINARY_CLOUD_NAME: <base64-encoded-value>
  CLOUDINARY_API_KEY: <base64-encoded-value>
  CLOUDINARY_API_SECRET: <base64-encoded-value>

  # Third-party services
  CLOUDCONVERT_API_KEY: <base64-encoded-value>
  RESEND_API_KEY: <base64-encoded-value>
  RECAPTCHA_SECRET_KEY: <base64-encoded-value>

  # Redis password
  REDIS_PASSWORD: <base64-encoded-value>