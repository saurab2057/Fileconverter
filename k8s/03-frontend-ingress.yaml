# =============================================================
# FILE LOCATION: fileconverter/k8s/03-frontend-ingress.yaml
#
# WHAT THIS FILE DOES:
# Creates 4 Kubernetes resources for frontend + traffic routing:
#
# 1. DEPLOYMENT  - Runs 2 copies of your React/NGINX frontend pod
#
# 2. SERVICE     - Stable internal address "frontend" on port 80
#
# 3. INGRESS     - The "front door" of your entire app
#                  Routes internet traffic:
#                  yourdomain.com/api/* → backend:5000
#                  yourdomain.com/*     → frontend:80
#                  Handles HTTPS/SSL automatically
#
# 4. ClusterIssuer - Tells cert-manager to get free SSL cert from Let's Encrypt
#                    Auto-renews every 90 days
#
# BEFORE APPLYING - Install these first:
#   # NGINX Ingress Controller
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#
#   # cert-manager (for automatic SSL)
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.0/cert-manager.yaml
#
# HOW TO APPLY (after prerequisites):
#   kubectl apply -f k8s/03-frontend-ingress.yaml
# =============================================================


# ── RESOURCE 1: Frontend Deployment ──────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fileconverter-app
  labels:
    app: frontend
    tier: web
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
      - name: frontend
        # Replace with your actual image
        # Format: ghcr.io/YOUR-GITHUB-USERNAME/frontend:latest
        image: ghcr.io/your-github-username/frontend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 80
          name: http

        # Frontend is lightweight - NGINX just serves static files
        resources:
          requests:
            cpu: "50m"               # very low - just serving static files
            memory: "64Mi"           # 64MB is plenty for NGINX
          limits:
            cpu: "200m"
            memory: "128Mi"

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10


---

# ── RESOURCE 2: Frontend Service ─────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fileconverter-app
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP


---

# ── RESOURCE 3: Ingress ───────────────────────────────────────
# The single entry point for ALL external traffic to your app
# Routes based on URL path:
#   https://yourdomain.com/api/... → backend service
#   https://yourdomain.com/...     → frontend service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fileconverter-ingress
  namespace: fileconverter-app
  annotations:
    # Use NGINX as the ingress controller
    kubernetes.io/ingress.class: "nginx"

    # Force all HTTP requests to redirect to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Max file upload size - matches your backend limits
    # Your conversionController handles file uploads
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"

    # Extended timeouts for AI summarization (large PDFs take time)
    # Matches your summarizerController which calls Python AI service
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # 5 minutes
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

    # Auto-get SSL certificate from Let's Encrypt
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Rate limiting at ingress level (extra layer on top of your rateLimiter.js)
    nginx.ingress.kubernetes.io/limit-rps: "20"

spec:
  # SSL/TLS configuration
  # cert-manager will automatically get and store the certificate here
  tls:
  - hosts:
    - yourdomain.com                 # ← REPLACE with your actual domain
    secretName: fileconverter-tls-cert

  rules:
  - host: yourdomain.com            # ← REPLACE with your actual domain
    http:
      paths:
      # Route /api/* to Node.js backend
      # Covers all your routes: /api/auth, /api/user, /api/convert, /api/chat, etc.
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5000

      # Route everything else to React frontend
      # React Router handles /dashboard, /login, /admin, etc.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80


---

# ── RESOURCE 4: ClusterIssuer ─────────────────────────────────
# Configures cert-manager to get SSL certificates from Let's Encrypt
# Let's Encrypt is FREE and trusted by all browsers
# Certificates auto-renew every 90 days - you never have to think about it
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Let's Encrypt production server (use staging for testing first)
    server: https://acme-v02.api.letsencrypt.org/directory

    # ← REPLACE with your actual email (used for expiry notifications)
    email: your-email@example.com

    # Where cert-manager stores the Let's Encrypt account key
    privateKeySecretRef:
      name: letsencrypt-prod-key

    # HTTP-01 challenge: Let's Encrypt verifies you own the domain
    # by checking a temporary file on your server
    solvers:
    - http01:
        ingress:
          class: nginx